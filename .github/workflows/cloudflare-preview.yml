name: BCO Cloudflare isolated preview

on:
  push:
    branches:
      - infra/cloudflare-workers-preview-2026-11-21
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bco_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bco_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 7bcfaba8091e97f6a78e3a61426c9b8a
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: bco_test
    steps:
      - name: Checkout isolated preview branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run Worker and design contract tests
        run: node --test tests/cloudflare-preview.mjs tests/outbox-design.test.mjs
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Create isolated PostgreSQL test schema
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/postgres-bootstrap.sql
          psql -v ON_ERROR_STOP=1 -f docs/integration-outbox-schema-proposal.sql
      - name: Verify outbox idempotency, retry, lease expiry and atomicity
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/outbox-postgres.sql
          bash tests/outbox-concurrency.sh
      - name: Verify organization and job Storage RLS
        run: bash tests/storage-rls-postgres.sh
      - name: Verify static preview has no server-side credentials
        run: |
          test -s public/index.html
          test -s public/app.js
          test ! -e .env.local
          test ! -d .vercel
          if grep -R -n -E 'sb_secret_|service_role|OPENAI_API_KEY|BLOB_READ_WRITE_TOKEN|BCO_INTEGRATION_SECRET=' public; then
            echo "Server-side credential marker found in public assets"
            exit 1
          fi
      - name: Install pinned Wrangler
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: npm install --no-save --package-lock=false wrangler@4.166.0
      - name: Deploy isolated workers.dev preview only
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          wranglerVersion: "4.166.0"
          command: deploy --config wrangler.toml --name bco-cloudflare-preview
      - name: Report missing deployment credential
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        run: echo "Tests passed; deployment skipped until CLOUDFLARE_API_TOKEN is configured."

  supabase-storage-auth:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated preview branch
        uses: actions/checkout@v4
      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 3.2.0
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Test real local Supabase Auth JWT and Storage RLS
        env:
          SUPABASE_TELEMETRY_DISABLED: "1"
          CI: "true"
        run: bash tests/supabase-storage-auth.sh
