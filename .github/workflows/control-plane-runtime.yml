name: Control Plane Runtime

on:
  push:
    branches:
      - bco/control-plane-v1
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Runtime
        run: |
          node --version
          npm --version
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: npm run check
        run: npm run check
      - name: smoke
        run: node tests/smoke.mjs
      - name: control-plane
        run: node tests/control-plane.mjs
      - name: control-plane-api
        id: api
        continue-on-error: true
        run: node tests/control-plane-api.mjs 2>&1 | tee control-plane-api.log; exit ${PIPESTATUS[0]}
      - name: Capture API failure
        if: steps.api.outcome == 'failure'
        run: |
          cat control-plane-api.log > API-FAILURE.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add API-FAILURE.txt
          git commit -m "ci: record API gate failure [skip ci]"
          git push
      - name: Fail API gate
        if: steps.api.outcome == 'failure'
        run: exit 1
      - name: npm test
        run: npm test
