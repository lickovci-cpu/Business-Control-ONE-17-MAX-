name: Control Plane Runtime

on:
  push:
    branches:
      - bco/control-plane-v1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: npm run check
        run: npm run check
      - name: npm test
        run: npm test
