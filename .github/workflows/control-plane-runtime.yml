name: Control Plane Runtime

on:
  push:
    branches:
      - bco/control-plane-v1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Runtime
        run: |
          node --version
          npm --version
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Cloudflare Worker build dry-run (no upload)
        run: npx --yes wrangler@latest deploy --dry-run --config workers/bco-automation/wrangler.jsonc --outdir /tmp/bco-worker-dry-run
      - name: npm run check
        run: npm run check
      - name: smoke
        run: node tests/smoke.mjs
      - name: control-plane
        run: node tests/control-plane.mjs
      - name: control-plane-api
        run: node tests/control-plane-api.mjs
      - name: npm test
        run: npm test

  deploy-staging:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy-bco-staging]')
    uses: ./.github/workflows/cloudflare-staging-deploy.yml
    with:
      confirm_deploy: true
    secrets: inherit
